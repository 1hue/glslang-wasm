name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: docker.io/emscripten/emsdk:6.0.13
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/cache@v6
        id: cache
        with:
          path: dist/
          key: dist-${{ hashFiles('.github/workflows/ci.yml', 'scripts/compile.sh', 'src/**', 'package-lock.json', 'tsconfig.json') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh scripts/compile.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
