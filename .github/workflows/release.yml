name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  attach:
    name: Attach to release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/setup-node@v7
        with:
          node-version: latest

      # Version from tag, none in package.json
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Pack
        run: npm pack

      - name: Attach to release
        run: gh release upload "$GITHUB_REF_NAME" glslang-wasm-*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: glslang-wasm-*.tgz

  stage:
    name: Stage on npm
    needs: attach
    runs-on: ubuntu-latest
    permissions:
      # npm trusted publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tarball

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org

      # Approve on npmjs.com > Staged Packages. GitHub pre-release -> npm tag next
      - name: Stage
        run: npm stage publish glslang-wasm-*.tgz ${{ github.event.release.prerelease && '--tag next' || '' }}
