name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  attach:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Check tag matches version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Pack
        run: npm pack

      - name: Attach to release
        run: gh release upload "$GITHUB_REF_NAME" glslang-wasm-*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
