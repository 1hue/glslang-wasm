version = 1
SPDX-PackageName = "glslang-wasm"
SPDX-PackageDownloadLocation = "https://github.com/1hue/glslang-wasm"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 1hue"
SPDX-License-Identifier = "MIT"

# Built from https://github.com/KhronosGroup/glslang and https://github.com/KhronosGroup/SPIRV-Cross
# (tags and commits in scripts/compile.sh) with Emscripten (MIT OR NCSA, MIT chosen) and its musl libc (MIT)
[[annotations]]
path = "dist/glslang.wasm"
precedence = "override"
SPDX-FileCopyrightText = [
  "2002-2026 The Khronos Group Inc. and glslang contributors",
  "2015-2026 Arm Limited and SPIRV-Cross contributors",
  "2010-2026 Emscripten authors",
  "2005-2020 Rich Felker, et al.",
]
SPDX-License-Identifier = "LicenseRef-glslang AND Apache-2.0 AND MIT"

[[annotations]]
path = "LICENSE-glslang"
precedence = "override"
SPDX-FileCopyrightText = "2002-2026 The Khronos Group Inc. and glslang contributors"
SPDX-License-Identifier = "LicenseRef-glslang"

[[annotations]]
path = "LICENSE-spirv-cross"
precedence = "override"
SPDX-FileCopyrightText = "2015-2026 Arm Limited and SPIRV-Cross contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "LICENSE-musl"
precedence = "override"
SPDX-FileCopyrightText = "2005-2020 Rich Felker, et al."
SPDX-License-Identifier = "MIT"

# Emscripten output
[[annotations]]
path = ["dist/glslang.js", "LICENSE-emscripten"]
precedence = "override"
SPDX-FileCopyrightText = "2010-2026 Emscripten authors"
SPDX-License-Identifier = "MIT"
