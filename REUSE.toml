version = 1
SPDX-PackageName = "glslang-wasm"
SPDX-PackageDownloadLocation = "https://github.com/1hue/glslang-wasm"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 1hue"
SPDX-License-Identifier = "MIT"

# Built from https://github.com/KhronosGroup/glslang (tag and commit in scripts/compile.sh)
# with Emscripten (MIT OR NCSA, MIT chosen) and its musl libc (MIT)
[[annotations]]
path = ["dist/glslang.wasm", "dist/LICENSE.glslang.txt"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2002-2026 The Khronos Group Inc. and glslang contributors",
  "2010-2026 Emscripten authors",
  "2005-2020 Rich Felker, et al.",
]
SPDX-License-Identifier = "LicenseRef-glslang AND MIT"

[[annotations]]
path = "dist/LICENSE.musl.txt"
precedence = "override"
SPDX-FileCopyrightText = "2005-2020 Rich Felker, et al."
SPDX-License-Identifier = "MIT"

# Emscripten output
[[annotations]]
path = ["dist/glslang.js", "dist/LICENSE.emscripten.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2010-2026 Emscripten authors"
SPDX-License-Identifier = "MIT"
